name: Build Isaac module snapshot overlay
on:
  workflow_dispatch:
  push:
    paths:
      - 'isaac-module-overlay/**'
      - '.github/workflows/build-isaac-module-overlay.yml'
  pull_request:
    paths:
      - 'isaac-module-overlay/**'
      - '.github/workflows/build-isaac-module-overlay.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:20260219
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned libtesla
        run: |
          git clone https://github.com/WerWolv/libtesla.git isaac-module-overlay/libs/libtesla
          git -C isaac-module-overlay/libs/libtesla checkout f766e9b607a05e9756843cbd62b3bfb98be1646c
      - name: Build overlay
        run: make -C isaac-module-overlay -j2
      - name: Package SD layout
        run: |
          mkdir -p artifact/switch/.overlays
          cp isaac-module-overlay/IsaacModuleSnapshot.ovl artifact/switch/.overlays/
          cp isaac-module-overlay/README.md artifact/
          sha256sum artifact/switch/.overlays/IsaacModuleSnapshot.ovl > artifact/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: IsaacModuleSnapshot-Overlay-SD
          path: artifact
          if-no-files-found: error

