name: Build Isaac module snapshot

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "isaac-module-snapshot/**"
      - ".github/workflows/build-isaac-module-snapshot.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:20260219
    env:
      DEVKITPRO: /opt/devkitpro
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build standalone read-only module snapshot
        shell: bash
        run: |
          set -euo pipefail
          make -C isaac-module-snapshot -j2
          mkdir -p dist/switch/TheModdingOfIsaac
          cp isaac-module-snapshot/IsaacModuleSnapshot.nro dist/switch/TheModdingOfIsaac/
          cp isaac-module-snapshot/README.md dist/README.md
          cp isaac-module-snapshot/COPYING dist/COPYING
          printf 'source_repository=https://github.com/angelcraft/TheModdingOfIsaac\nsource_commit=%s\n' "$SOURCE_COMMIT" > dist/BUILD.txt
          cd dist
          sha256sum switch/TheModdingOfIsaac/IsaacModuleSnapshot.nro > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: IsaacModuleSnapshot-SD
          path: dist/
