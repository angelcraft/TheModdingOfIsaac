# Copy to .github/workflows/build-isaac-workshop-nx.yml in the existing
# angelcraft/TheModdingOfIsaac repository. Deliberately restricted to the
# isolated prototype branch so older experimental pipelines are not changed.
name: Isaac Workshop NX - Build NRO
on:
  push:
    branches:
      - feature/isaac-workshop-nx-20261116
    paths:
      - 'isaac-workshop-nx/**'
      - '.github/workflows/build-isaac-workshop-nx.yml'
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate SteamPipe metadata and ZIP importer
        working-directory: isaac-workshop-nx
        run: make host-test
  build:
    needs: host-tests
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:20260219
    steps:
      - uses: actions/checkout@v4
      - name: Probe native WebSocket transport for Steam CM
        shell: bash
        run: |
          set -eu
          HDR=/opt/devkitpro/portlibs/switch/include/curl/curl.h
          LIB=/opt/devkitpro/portlibs/switch/lib/libcurl.a
          NM=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-nm
          if grep -q 'curl_ws_recv' "$HDR"; then
            echo "HEADER_WS_API=yes"
          else
            echo "HEADER_WS_API=no"
          fi
          if test -f "$LIB" && test -x "$NM"; then
            if "$NM" -g "$LIB" 2>/dev/null | grep -Eq ' [TW] curl_ws_recv$'; then
              echo "LINK_WS_RECV=yes"
            else
              echo "LINK_WS_RECV=no"
            fi
            if "$NM" -g "$LIB" 2>/dev/null | grep -Eq ' [TW] curl_ws_send$'; then
              echo "LINK_WS_SEND=yes"
            else
              echo "LINK_WS_SEND=no"
            fi
          else
            echo "STATIC_CURL_LIB_OR_NM_MISSING"
          fi
      - name: Compile Switch homebrew
        working-directory: isaac-workshop-nx
        run: |
          test -f /opt/devkitpro/portlibs/switch/include/curl/curl.h
          test -f /opt/devkitpro/portlibs/switch/include/zlib.h
          make
      - uses: actions/upload-artifact@v4
        with:
          name: IsaacWorkshopNX-0.10-CDN-manifest-NO-MOD-INSTALL
          path: isaac-workshop-nx/IsaacWorkshopNX.nro
          if-no-files-found: error
