name: Build guarded Isaac Lua frame bridge

on:
  workflow_dispatch:
  push:
    paths:
      - "saltynx-lua-bridge/**"
      - "tools/livebridge/**"
      - "tools/import_workshop_candidate.py"
      - "tools/test_import_workshop_candidate.py"
      - ".github/workflows/build-saltynx-lua-bridge.yml"
  pull_request:
    paths:
      - "saltynx-lua-bridge/**"
      - "tools/livebridge/**"
      - "tools/import_workshop_candidate.py"
      - "tools/test_import_workshop_candidate.py"
      - ".github/workflows/build-saltynx-lua-bridge.yml"

permissions:
  contents: read

jobs:
  coroutine-budget-test:
    runs-on: ubuntu-latest
    env:
      LUA_REF: b1406bb55375787b3559bd1981020541c95a2bee
    steps:
      - uses: actions/checkout@v4
      - name: Verify Workshop candidate staging
        run: python3 tools/test_import_workshop_candidate.py -v
      - name: Verify Lua 5.1 coroutine instruction budget
        shell: bash
        run: |
          set -euo pipefail
          LUA_DIR="$RUNNER_TEMP/lua51-switch"
          git clone --quiet https://github.com/carstene1ns/lua51-switch.git "$LUA_DIR"
          git -C "$LUA_DIR" checkout --quiet "$LUA_REF"
          make -C "$LUA_DIR/src" clean linux CC=gcc AR="ar rcu" RANLIB=ranlib
          gcc -std=c99 -Wall -Wextra -Werror \
            -I"$LUA_DIR/src" \
            "$GITHUB_WORKSPACE/saltynx-lua-bridge/tests/coroutine_instruction_budget.c" \
            "$LUA_DIR/src/liblua.a" -lm -ldl \
            -o "$RUNNER_TEMP/coroutine_instruction_budget"
          "$RUNNER_TEMP/coroutine_instruction_budget"
          g++ -std=c++17 -Wall -Wextra -Werror \
            -I"$LUA_DIR/src" \
            -I"$GITHUB_WORKSPACE/saltynx-lua-bridge/source" \
            "$GITHUB_WORKSPACE/saltynx-lua-bridge/tests/workshop_loader_host_test.cpp" \
            "$LUA_DIR/src/liblua.a" -lm -ldl \
            -o "$RUNNER_TEMP/workshop_loader_host_test"
          "$RUNNER_TEMP/workshop_loader_host_test" \
            "$GITHUB_WORKSPACE/saltynx-lua-bridge/workshop_demo"

  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:20240202
    env:
      DEVKITPRO: /opt/devkitpro
      NXFPS_REF: c66727368cfd4d55f6424176d43a5ef4da1465c3
      LUA_REF: b1406bb55375787b3559bd1981020541c95a2bee
    steps:
      - uses: actions/checkout@v4
      - name: Build guarded bridge
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/saltynx-lua-bridge"
          DEPS="$RUNNER_TEMP/saltynx-lua-bridge-deps"
          git clone --quiet https://github.com/masagrator/NX-FPS.git "$DEPS/NX-FPS"
          git -C "$DEPS/NX-FPS" checkout --quiet "$NXFPS_REF"
          git clone --quiet https://github.com/carstene1ns/lua51-switch.git "$DEPS/lua51-switch"
          git -C "$DEPS/lua51-switch" checkout --quiet "$LUA_REF"
          make -C "$DEPS/lua51-switch/src" switch

          cp "$ROOT/source/main.cpp" "$DEPS/NX-FPS/source/main.cpp"
          cp "$ROOT/source/"*.h "$DEPS/NX-FPS/source/"
          sed -i 's|^TARGET[[:space:]]*:=.*|TARGET := IsaacLuaBridge|' "$DEPS/NX-FPS/Makefile"
          sed -i 's|^INCLUDES[[:space:]]*:=.*|INCLUDES := include ../lua51-switch/src|' "$DEPS/NX-FPS/Makefile"
          sed -i 's|^LIBS[[:space:]]*:=.*|LIBS := -lnx_min -L'"$DEPS"'/lua51-switch/src -llua -lm|' "$DEPS/NX-FPS/Makefile"
          make -C "$DEPS/NX-FPS" clean
          make -C "$DEPS/NX-FPS" -j2

          mkdir -p "$ROOT/dist/SaltySD/plugins/010021C000B6A000"
          cp "$DEPS/NX-FPS/IsaacLuaBridge.elf" "$ROOT/dist/SaltySD/plugins/010021C000B6A000/"
          cp "$ROOT/bridge.lua" "$ROOT/dist/SaltySD/plugins/010021C000B6A000/"
          cp "$ROOT/README.md" "$ROOT/dist/"
          mkdir -p "$ROOT/dist/examples/switch/TheModdingOfIsaac/mods/demo"
          mkdir -p "$ROOT/dist/examples/switch/TheModdingOfIsaac/mods/isolation"
          cp "$ROOT/workshop_demo/mods.txt" "$ROOT/dist/examples/switch/TheModdingOfIsaac/mods.txt"
          cp "$ROOT/workshop_demo/mods/demo/main.lua" "$ROOT/dist/examples/switch/TheModdingOfIsaac/mods/demo/main.lua"
          cp "$ROOT/workshop_demo/mods/isolation/main.lua" "$ROOT/dist/examples/switch/TheModdingOfIsaac/mods/isolation/main.lua"
          cp "$GITHUB_WORKSPACE/docs/WORKSHOP_COMPAT_V1.md" "$ROOT/dist/WORKSHOP_COMPAT_V1.md"
          printf 'version=0.8.0-experimental\nsource_commit=%s\nstable_0_3_8=103e5e4563f475bad318241b3bc5fb5c1544f758\nstable_0_6_0=cf8c5f8e8a35fda44f638e3d5120fab0afaf6da9\n' "$GITHUB_SHA" > "$ROOT/dist/BUILD.txt"
          cd "$ROOT/dist"
          sha256sum SaltySD/plugins/010021C000B6A000/* > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: IsaacLuaBridge-guarded-frame-callback-SD
          path: saltynx-lua-bridge/dist/
          if-no-files-found: error


